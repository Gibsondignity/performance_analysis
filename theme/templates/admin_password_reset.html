{% extends 'base.html' %}

{% block title %}Reset User Password{% endblock %}

{% block content %}

<div class="max-w-md mx-auto bg-white p-6 rounded-lg shadow-md">

    <h2 class="text-2xl font-bold mb-4">Reset User Password</h2>

    <form method="post">

        {% csrf_token %}

        <div class="mb-4">

            <label for="{{ form.email.id_for_label }}" class="block text-sm font-medium text-gray-700">User Email</label>

            {{ form.email }}

            {{ form.email.errors }}

        </div>

        <div class="mb-4">

            <label for="{{ form.password1.id_for_label }}" class="block text-sm font-medium text-gray-700">New Password</label>

            {{ form.password1 }}

            {{ form.password1.errors }}

        </div>

        <div class="mb-4">

            <label for="{{ form.password2.id_for_label }}" class="block text-sm font-medium text-gray-700">Confirm New Password</label>

            {{ form.password2 }}

            {{ form.password2.errors }}

        </div>

        <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded">Reset Password</button>

    </form>

</div>

{% endblock %}
